name: reset-staging-to-tag
run-name: >-
  ${{ github.event.inputs.mode == 'list-tags' && 'list Gitee tags (no push)'
      || format('reset staging → {0}', github.event.inputs.tag) }}

# GitHub 的 Run workflow 无法动态下拉远端 tag（choice 选项必须写死在 YAML 里）。
# 因此分两步：先 list-tags 看列表，再 reset-staging 填上选中的 tag 名。
# 手机：Actions → 本 workflow → Run workflow。

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "① 先选做什么（list-tags=只看有哪些 tag，不会改车；reset-staging=真的回退）"
        required: true
        type: choice
        options:
          - list-tags
          - reset-staging
        default: list-tags
      tag:
        description: "② 回退才填：复制最近列表里的完整 tag 名（不要带序号）；list 时留空"
        required: false
        type: string
        default: ""
      confirm:
        description: "③ 回退才填：三个字母 RESET（list 时留空；填错不会改 staging）"
        required: false
        type: string
        default: ""
      push_codeup:
        description: "④ 回退时连阿里云效一起拨（建议保持勾选）"
        required: false
        type: boolean
        default: true

concurrency:
  group: reset-staging-to-tag
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Guard (reset only)
        if: github.event.inputs.mode == 'reset-staging'
        shell: bash
        env:
          CONFIRM: ${{ github.event.inputs.confirm }}
          TAG_IN: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "${TAG_IN// /}" ]; then
            echo "::error::reset-staging 需要填写 tag（先用 list-tags 查出名字再粘贴）"
            exit 1
          fi
          if [ "${CONFIRM}" != "RESET" ]; then
            echo "::error::confirm 必须为 RESET，已中止（不会改 staging）"
            exit 1
          fi

      - name: Setup SSH agent (Gitee)
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.GITEE_SSH_PRIVATE_KEY }}

      - name: known_hosts + Codeup key
        shell: bash
        env:
          ALIYUN_SSH_PRIVATE_KEY: ${{ secrets.ALIYUN_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -T 15 -t rsa,ecdsa,ed25519 gitee.com >> ~/.ssh/known_hosts 2>/dev/null || true
          if [ -n "${ALIYUN_SSH_PRIVATE_KEY:-}" ]; then
            printf '%s\n' "$ALIYUN_SSH_PRIVATE_KEY" > ~/.ssh/sp-cn
            chmod 600 ~/.ssh/sp-cn
            ssh-keyscan -T 15 -t rsa,ecdsa,ed25519 codeup.aliyun.com >> ~/.ssh/known_hosts 2>/dev/null || true
          fi

      - name: 列出 tag（未改 staging）
        if: github.event.inputs.mode == 'list-tags'
        shell: bash
        env:
          GITEE_REPO_SSH: ${{ secrets.GITEE_REPO_SSH }}
        run: |
          set -euo pipefail
          if [ -z "${GITEE_REPO_SSH:-}" ]; then
            echo "::error::缺少 secret GITEE_REPO_SSH"
            exit 1
          fi
          echo "============================================================"
          echo "只列出最近 10 个 tag（按创建时间，新的在上）"
          echo "复制 tag 全名（不要带序号），再点一次 Run workflow 回退"
          echo "  ① mode = reset-staging"
          echo "  ② tag  = 粘贴下面某一行的全名"
          echo "  ③ confirm = RESET"
          echo "  ④ Codeup 建议保持勾选"
          echo "============================================================"
          WORK="$RUNNER_TEMP/taglist.git"
          git init --bare "$WORK"
          git --git-dir="$WORK" remote add origin "$GITEE_REPO_SSH"
          git --git-dir="$WORK" fetch --no-tags origin "refs/tags/*:refs/tags/*"
          git --git-dir="$WORK" for-each-ref --sort=-creatordate --format='%(refname:short)' refs/tags \
            > /tmp/all-tags.txt
          TOTAL=$(wc -l < /tmp/all-tags.txt | tr -d ' ')
          head -n 10 /tmp/all-tags.txt > /tmp/recent-tags.txt
          i=1
          while IFS= read -r t; do
            [ -z "$t" ] && continue
            printf '(%d) %s\n' "$i" "$t"
            i=$((i + 1))
          done < /tmp/recent-tags.txt
          echo "============================================================"
          echo "当前 Gitee staging 指向的提交："
          git ls-remote "$GITEE_REPO_SSH" refs/heads/staging || true
          echo "============================================================"
          SHOWN=$(wc -l < /tmp/recent-tags.txt | tr -d ' ')
          echo "[ok] 列出最近 ${SHOWN} 个（远端共 ${TOTAL} 个）。本次没有推送、车上不会变。"
          {
            echo "## 最近 10 个可回退 tag（复制全名，不要带序号）"
            echo ""
            echo '```'
            cat /tmp/recent-tags.txt
            echo '```'
            echo ""
            echo "远端共 ${TOTAL} 个 tag，此处只列最近 10 个。"
            echo "下一步：Run workflow → ① reset-staging → ② 粘贴 tag 全名 → ③ RESET"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 强推 staging 到指定 tag
        if: github.event.inputs.mode == 'reset-staging'
        shell: bash
        env:
          GITEE_REPO_SSH: ${{ secrets.GITEE_REPO_SSH }}
          TAG_IN: ${{ github.event.inputs.tag }}
          PUSH_CODEUP: ${{ github.event.inputs.push_codeup }}
        run: |
          set -euo pipefail
          TAG="${TAG_IN#"${TAG_IN%%[![:space:]]*}"}"
          TAG="${TAG%"${TAG##*[![:space:]]}"}"
          TAG="${TAG#refs/tags/}"
          if [ -z "$TAG" ]; then
            echo "::error::tag 为空"
            exit 1
          fi
          if [ -z "${GITEE_REPO_SSH:-}" ]; then
            echo "::error::缺少 secret GITEE_REPO_SSH"
            exit 1
          fi

          CODEUP_SSH="git@codeup.aliyun.com:6a0b0c8d706afd34aa607161/sunnypilot_cn.git"
          WORK="$RUNNER_TEMP/sunnypilot_cn.git"
          git init --bare "$WORK"
          git --git-dir="$WORK" remote add origin "$GITEE_REPO_SSH"

          echo "[fetch] origin refs/tags/${TAG}"
          git --git-dir="$WORK" fetch --no-tags origin "refs/tags/${TAG}:refs/tags/${TAG}"
          SHA="$(git --git-dir="$WORK" rev-parse "${TAG}^{commit}")"
          echo "[ok] tag=${TAG} → ${SHA}"

          echo "[push] Gitee staging = ${SHA:0:12}"
          git --git-dir="$WORK" push --force origin "${SHA}:refs/heads/staging"

          if [ "${PUSH_CODEUP}" = "true" ]; then
            if [ ! -f ~/.ssh/sp-cn ]; then
              echo "::warning::无 ALIYUN_SSH_PRIVATE_KEY，跳过 Codeup"
            else
              echo "[push] Codeup staging = ${SHA:0:12}"
              GIT_SSH_COMMAND='ssh -i ~/.ssh/sp-cn -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes' \
                git --git-dir="$WORK" push --force "$CODEUP_SSH" "${SHA}:refs/heads/staging"
            fi
          fi

          echo "[done] 车上目标分支保持 staging；下次检查更新会拉到 ${SHA:0:12}"
          echo "[done] 之后若再跑 sync-to-gitee 菜单 3 / Actions pull+push，会把 staging 推回上游 tip"
          {
            echo "## reset staging → \`${TAG}\`"
            echo ""
            echo "- commit: \`${SHA}\`"
            echo "- 车上仍跟踪 **staging**，下次检查更新会拉到上述提交"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup old workflow runs (keep latest 5)
        if: always()
        continue-on-error: true
        uses: actions/github-script@v8
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const workflow_id = "reset-staging-to-tag.yml";
            const keep = 5;

            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner,
              repo,
              workflow_id,
              per_page: 100,
              exclude_pull_requests: true,
            });

            const filtered = runs.filter(r =>
              r.id !== context.runId &&
              r.status !== "in_progress" &&
              r.status !== "queued"
            );

            if (filtered.length <= keep) {
              core.info(`No cleanup needed. Runs=${filtered.length}, keep=${keep}`);
              return;
            }

            const toDelete = filtered.slice(keep);
            core.info(`Deleting ${toDelete.length} old workflow runs (keeping latest ${keep})`);

            for (const r of toDelete) {
              try {
                await github.rest.actions.deleteWorkflowRun({ owner, repo, run_id: r.id });
                core.info(`Deleted run_id=${r.id} created_at=${r.created_at} status=${r.status}`);
              } catch (e) {
                core.warning(`Failed to delete run_id=${r.id}: ${e.message}`);
              }
            }
