name: sync-to-gitee
run-name: >-
  ${{
    github.event_name == 'schedule' && format('sync-to-gitee (scheduled) @ {0}', github.ref_name)
    || github.event_name == 'workflow_dispatch' && (
      (github.event.inputs.force_sync == 'true' && format('sync-to-gitee (manual,force) @ {0}', github.ref_name))
      || format('sync-to-gitee (manual) @ {0}', github.ref_name)
    )
    || format('sync-to-gitee ({0}) @ {1}', github.event_name, github.ref_name)
  }}

on:
  schedule:
    # 每小时第 23 分钟（UTC），避开大量仓库扎堆整点触发；仍可能有数分钟抖动。
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      force_sync:
        description: "Force re-sync and push even if upstream SHA unchanged"
        required: false
        type: boolean
        default: false

concurrency:
  group: sync-to-gitee
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # GitHub 将逐步收回 Node 20；邮件步骤所用 action 已升级到 node24 版本（见 dawidd6/action-send-mail）。
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Setup SSH agent (Gitee deploy key)
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.GITEE_SSH_PRIVATE_KEY }}

      - name: Restore Gitee known_hosts cache
        id: gitee_known_hosts_cache
        uses: actions/cache/restore@v5
        with:
          path: .ci-cache/gitee-known_hosts
          key: gitee-known-hosts-v1
          restore-keys: |
            gitee-known-hosts-

      - name: Add gitee.com to known_hosts
        id: gitee_known_hosts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh .ci-cache
          chmod 700 ~/.ssh
          CACHE_FILE=".ci-cache/gitee-known_hosts"
          REFRESHED=false

          install_known_hosts() {
            cp "$CACHE_FILE" ~/.ssh/known_hosts
            chmod 600 ~/.ssh/known_hosts
          }

          keyscan_to_cache() {
            local scan_tmp attempt port
            scan_tmp="$(mktemp)"
            for attempt in 1 2 3 4 5; do
              : > "$scan_tmp"
              for port in 22 443; do
                if ssh-keyscan -T 15 -p "$port" -t rsa,ecdsa,ed25519 gitee.com >"$scan_tmp" 2>/dev/null \
                  && grep -q '^gitee.com ' "$scan_tmp"; then
                  grep '^gitee.com ' "$scan_tmp" | sort -u > "$CACHE_FILE"
                  install_known_hosts
                  echo "[known_hosts] ssh-keyscan ok (attempt ${attempt}, port ${port})"
                  rm -f "$scan_tmp"
                  return 0
                fi
              done
              echo "[known_hosts] ssh-keyscan attempt ${attempt}/5 failed, retry in $((attempt * 5))s..."
              sleep $((attempt * 5))
            done
            rm -f "$scan_tmp"
            return 1
          }

          # 仅当 host key 被 SSH 明确拒绝时才刷新；超时/网络抖动仍沿用缓存
          host_key_usable() {
            local out
            out="$(ssh -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes \
              -o NumberOfPasswordPrompts=0 -T git@gitee.com 2>&1)" || true
            if echo "$out" | grep -qiE 'Host key verification failed|REMOTE HOST IDENTIFICATION HAS CHANGED'; then
              return 1
            fi
            return 0
          }

          if [ -f "$CACHE_FILE" ] && grep -q '^gitee.com ' "$CACHE_FILE"; then
            install_known_hosts
            echo "[known_hosts] loaded from Actions cache (restore hit=${{ steps.gitee_known_hosts_cache.outputs.cache-hit }})"
            if host_key_usable; then
              echo "[known_hosts] cache keys accepted by SSH"
            else
              echo "[known_hosts] cache keys rejected, refreshing via ssh-keyscan..."
              keyscan_to_cache || { echo "::error::known_hosts: cache invalid and ssh-keyscan failed"; exit 1; }
              REFRESHED=true
            fi
          else
            echo "[known_hosts] cache miss or empty, scanning gitee.com..."
            keyscan_to_cache || { echo "::error::known_hosts: ssh-keyscan failed"; exit 1; }
            REFRESHED=true
          fi

          grep -q '^gitee.com ' ~/.ssh/known_hosts
          echo "refreshed=${REFRESHED}" >> "$GITHUB_OUTPUT"

      - name: Save Gitee known_hosts cache
        if: >-
          steps.gitee_known_hosts.outputs.refreshed == 'true' ||
          steps.gitee_known_hosts_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .ci-cache/gitee-known_hosts
          key: gitee-known-hosts-v1

      - name: Sync upstream -> patch -> push to Gitee
        id: sync
        shell: bash
        env:
          GITEE_REPO_SSH: ${{ secrets.GITEE_REPO_SSH }}
          # 避免 CI 因 LFS 推送耗时/不稳定而失败（脚本内部也会 setdefault）
          GIT_LFS_SKIP_PUSH: "1"
          # 仅当上游子模块指针发生变化时才更新子模块（提速且更接近本地行为）
          SKIP_SUBMODULES: "auto"
          FORCE_SYNC: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.force_sync == 'true' && '1' || '' }}
          # 成功邮件里上游 git log：仅「当日」自然日（默认 UTC；需要可改 Asia/Shanghai 等）
          SYNC_EMAIL_LOG_TZ: "UTC"
          SYNC_EMAIL_LOG_MAX: "6"
        run: |
          set -euo pipefail

          WORKDIR="$GITHUB_WORKSPACE/sunnypilot"
          if [ ! -d "$WORKDIR/.git" ]; then
            rm -rf "$WORKDIR"
            git clone --depth=1 "https://github.com/sunnypilot/sunnypilot.git" "$WORKDIR"
          fi

          # 有限重试：应对偶发网络/服务抖动（push、fetch、API 临时失败等）
          max_attempts=3
          attempt=1
          while true; do
            echo "[sync] attempt ${attempt}/${max_attempts}"
            set +e
            python3 "$GITHUB_WORKSPACE/tools/sync_to_gitee.py" \
              --action all \
              --workdir "$WORKDIR" \
              --origin "$GITEE_REPO_SSH" \
              --upstream "https://github.com/sunnypilot/sunnypilot.git"
            ec=$?
            set -e
            if [ "$ec" -eq 0 ]; then
              break
            fi
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "[sync] failed after ${max_attempts} attempts (exit_code=${ec})"
              exit "$ec"
            fi
            sleep_s=$((attempt * 20))
            echo "[sync] retrying in ${sleep_s}s (exit_code=${ec})"
            sleep "$sleep_s"
            attempt=$((attempt + 1))
          done

      # 成功通知条件（三者同时满足，AND）：作业成功 + 至少跑过一轮完整同步(attempted_sync) + 已推送(pushed)。
      # attempted_sync 含：上游相对 Gitee 记录有变化；或手动勾选 Force（FORCE_SYNC）即使上游 SHA 未变。
      # 未配置 SMTP 时本步骤可能报错，已 continue-on-error。
      - name: Notify mail — sync OK (ran sync + pushed to Gitee)
        if: >-
          success() &&
          steps.sync.outputs.attempted_sync == 'true' &&
          steps.sync.outputs.pushed == 'true'
        continue-on-error: true
        uses: dawidd6/action-send-mail@v17
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: 465
          secure: true
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASS }}
          subject: "[OK] sp_cn_sync-bot"
          to: ${{ secrets.MAIL_TO }}
          from: ${{ secrets.MAIL_FROM }}
          body: ${{ steps.sync.outputs.notify_success_body }}

      - name: Notify mail — sync FAILED (after sync attempt)
        if: >-
          failure() &&
          steps.sync.outputs.attempted_sync == 'true'
        continue-on-error: true
        uses: dawidd6/action-send-mail@v17
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: 465
          secure: true
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASS }}
          subject: >-
            [FAIL] ${{ github.repository }} sync-to-gitee (run ${{ github.run_id }})
          to: ${{ secrets.MAIL_TO }}
          from: ${{ secrets.MAIL_FROM }}
          body: |
            sunnypilot_cn → Gitee 同步失败（已进入完整同步流程：含上游有更新或手动 Force；可能是 verify_patches、git 或推送错误）。

            branches: ${{ steps.sync.outputs.sync_branches }}
            attempted_sync=${{ steps.sync.outputs.attempted_sync }} pushed=${{ steps.sync.outputs.pushed }}

            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Cleanup old workflow runs (keep latest 20)
        if: always()
        continue-on-error: true
        uses: actions/github-script@v8
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const workflow_id = "sync-to-gitee.yml";
            const keep = 20;

            // List runs (newest first)
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner,
              repo,
              workflow_id,
              per_page: 100,
              exclude_pull_requests: true,
            });

            // Filter out the current run and any in-progress/queued runs
            const filtered = runs.filter(r =>
              r.id !== context.runId &&
              r.status !== "in_progress" &&
              r.status !== "queued"
            );

            if (filtered.length <= keep) {
              core.info(`No cleanup needed. Runs=${filtered.length}, keep=${keep}`);
              return;
            }

            const toDelete = filtered.slice(keep);
            core.info(`Deleting ${toDelete.length} old workflow runs (keeping latest ${keep})`);

            for (const r of toDelete) {
              try {
                await github.rest.actions.deleteWorkflowRun({ owner, repo, run_id: r.id });
                core.info(`Deleted run_id=${r.id} created_at=${r.created_at} status=${r.status}`);
              } catch (e) {
                core.warning(`Failed to delete run_id=${r.id}: ${e.message}`);
              }
            }
