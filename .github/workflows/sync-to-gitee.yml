name: sync-to-gitee
run-name: >-
  ${{
    github.event_name == 'schedule' && format('sync-to-gitee (scheduled) @ {0}', github.ref_name)
    || github.event_name == 'workflow_dispatch' && (
      (github.event.inputs.force_sync == 'true' && format('sync-to-gitee (manual,force) @ {0}', github.ref_name))
      || format('sync-to-gitee (manual) @ {0}', github.ref_name)
    )
    || format('sync-to-gitee ({0}) @ {1}', github.event_name, github.ref_name)
  }}

on:
  schedule:
    # 每 2 小时第 23 分钟（UTC）：0/2/4/…/22 点；避开整点扎堆，仍可能有数分钟抖动。
    - cron: "23 */2 * * *"
  workflow_dispatch:
    inputs:
      force_sync:
        description: "Force re-sync and push even if upstream SHA unchanged"
        required: false
        type: boolean
        default: false

concurrency:
  group: sync-to-gitee
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # GitHub 将逐步收回 Node 20；邮件步骤所用 action 已升级到 node24 版本（见 dawidd6/action-send-mail）。
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Setup SSH agent (Gitee deploy key)
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.GITEE_SSH_PRIVATE_KEY }}

      - name: Restore Gitee known_hosts cache
        id: gitee_known_hosts_cache
        uses: actions/cache/restore@v5
        with:
          path: .ci-cache/gitee-known_hosts
          key: gitee-known-hosts-v1
          restore-keys: |
            gitee-known-hosts-

      - name: Add gitee.com to known_hosts
        id: gitee_known_hosts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh .ci-cache
          chmod 700 ~/.ssh
          CACHE_FILE=".ci-cache/gitee-known_hosts"
          REFRESHED=false

          install_known_hosts() {
            cp "$CACHE_FILE" ~/.ssh/known_hosts
            chmod 600 ~/.ssh/known_hosts
          }

          keyscan_to_cache() {
            local scan_tmp attempt port
            scan_tmp="$(mktemp)"
            for attempt in 1 2 3 4 5; do
              : > "$scan_tmp"
              for port in 22 443; do
                if ssh-keyscan -T 15 -p "$port" -t rsa,ecdsa,ed25519 gitee.com >"$scan_tmp" 2>/dev/null \
                  && grep -q '^gitee.com ' "$scan_tmp"; then
                  grep '^gitee.com ' "$scan_tmp" | sort -u > "$CACHE_FILE"
                  install_known_hosts
                  echo "[known_hosts] ssh-keyscan ok (attempt ${attempt}, port ${port})"
                  rm -f "$scan_tmp"
                  return 0
                fi
              done
              echo "[known_hosts] ssh-keyscan attempt ${attempt}/5 failed, retry in $((attempt * 5))s..."
              sleep $((attempt * 5))
            done
            rm -f "$scan_tmp"
            return 1
          }

          # 仅当 host key 被 SSH 明确拒绝时才刷新；超时/网络抖动仍沿用缓存
          host_key_usable() {
            local out
            out="$(ssh -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes \
              -o NumberOfPasswordPrompts=0 -T git@gitee.com 2>&1)" || true
            if echo "$out" | grep -qiE 'Host key verification failed|REMOTE HOST IDENTIFICATION HAS CHANGED'; then
              return 1
            fi
            return 0
          }

          if [ -f "$CACHE_FILE" ] && grep -q '^gitee.com ' "$CACHE_FILE"; then
            install_known_hosts
            echo "[known_hosts] loaded from Actions cache (restore hit=${{ steps.gitee_known_hosts_cache.outputs.cache-hit }})"
            if host_key_usable; then
              echo "[known_hosts] cache keys accepted by SSH"
            else
              echo "[known_hosts] cache keys rejected, refreshing via ssh-keyscan..."
              keyscan_to_cache || { echo "::error::known_hosts: cache invalid and ssh-keyscan failed"; exit 1; }
              REFRESHED=true
            fi
          else
            echo "[known_hosts] cache miss or empty, scanning gitee.com..."
            keyscan_to_cache || { echo "::error::known_hosts: ssh-keyscan failed"; exit 1; }
            REFRESHED=true
          fi

          grep -q '^gitee.com ' ~/.ssh/known_hosts
          echo "refreshed=${REFRESHED}" >> "$GITHUB_OUTPUT"

      - name: Save Gitee known_hosts cache
        if: >-
          steps.gitee_known_hosts.outputs.refreshed == 'true' ||
          steps.gitee_known_hosts_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .ci-cache/gitee-known_hosts
          key: gitee-known-hosts-v1

      - name: Setup Codeup SSH key (Aliyun)
        shell: bash
        env:
          ALIYUN_SSH_PRIVATE_KEY: ${{ secrets.ALIYUN_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          if [ -z "${ALIYUN_SSH_PRIVATE_KEY:-}" ]; then
            echo "::warning::ALIYUN_SSH_PRIVATE_KEY 未配置，将跳过云效 push"
            exit 0
          fi
          printf '%s\n' "$ALIYUN_SSH_PRIVATE_KEY" > ~/.ssh/sp-cn
          chmod 600 ~/.ssh/sp-cn
          grep -q 'BEGIN.*PRIVATE KEY' ~/.ssh/sp-cn
          ssh-keyscan -T 15 -t rsa,ecdsa,ed25519 codeup.aliyun.com >> ~/.ssh/known_hosts 2>/dev/null || true
          echo "[codeup] wrote ~/.ssh/sp-cn for sync_to_gitee aliyun remote"

      - name: Sync upstream -> patch (no push)
        id: sync_pull
        shell: bash
        env:
          GITEE_REPO_SSH: ${{ secrets.GITEE_REPO_SSH }}
          SKIP_SUBMODULES: "auto"
          FORCE_SYNC: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.force_sync == 'true' && '1' || '' }}
          SYNC_EMAIL_LOG_TZ: "UTC"
          SYNC_EMAIL_LOG_MAX: "6"
          SP_CN_TOKEN: ${{ secrets.SP_CN_TOKEN }}
        run: |
          set -euo pipefail
          WORKDIR="$GITHUB_WORKSPACE/sunnypilot"
          if [ ! -d "$WORKDIR/.git" ]; then
            rm -rf "$WORKDIR"
            git clone --depth=1 "https://github.com/sunnypilot/sunnypilot.git" "$WORKDIR"
          fi
          max_attempts=3
          attempt=1
          while true; do
            echo "[sync-pull] attempt ${attempt}/${max_attempts}"
            set +e
            python3 "$GITHUB_WORKSPACE/tools/sync_to_gitee.py" \
              --action pull \
              --workdir "$WORKDIR" \
              --origin "$GITEE_REPO_SSH" \
              --upstream "https://github.com/sunnypilot/sunnypilot.git"
            ec=$?
            set -e
            if [ "$ec" -eq 0 ]; then break; fi
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "[sync-pull] failed after ${max_attempts} attempts (exit_code=${ec})"
              exit "$ec"
            fi
            sleep $((attempt * 20))
            attempt=$((attempt + 1))
          done

      - name: Resolve CI push targets
        id: push_targets
        if: steps.sync_pull.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/tools/sync_to_gitee.py" --action print-ci-push-targets

      # 先推 Codeup（较快）；Gitee 易卡住放后面，最多等待 10 分钟
      - name: Push to Codeup (Aliyun)
        id: sync_push_codeup
        if: >-
          steps.sync_pull.outcome == 'success' &&
          steps.push_targets.outputs.codeup_enabled == 'true'
        shell: bash
        env:
          GITEE_REPO_SSH: ${{ secrets.GITEE_REPO_SSH }}
          SYNC_GITEE_SINGLE_COMMIT: "1"
          SP_CN_TOKEN: ${{ secrets.SP_CN_TOKEN }}
        run: |
          set -euo pipefail
          WORKDIR="$GITHUB_WORKSPACE/sunnypilot"
          max_attempts=3
          attempt=1
          while true; do
            echo "[push-codeup] attempt ${attempt}/${max_attempts}"
            set +e
            python3 "$GITHUB_WORKSPACE/tools/sync_to_gitee.py" \
              --action push-codeup \
              --workdir "$WORKDIR" \
              --origin "$GITEE_REPO_SSH" \
              --upstream "https://github.com/sunnypilot/sunnypilot.git"
            ec=$?
            set -e
            if [ "$ec" -eq 0 ]; then break; fi
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "[push-codeup] failed after ${max_attempts} attempts (exit_code=${ec})"
              exit "$ec"
            fi
            sleep $((attempt * 20))
            attempt=$((attempt + 1))
          done

      - name: Push to Gitee
        id: sync_push_gitee
        if: >-
          steps.sync_pull.outcome == 'success' &&
          steps.push_targets.outputs.gitee_enabled == 'true'
        timeout-minutes: 10
        continue-on-error: true
        shell: bash
        env:
          GITEE_REPO_SSH: ${{ secrets.GITEE_REPO_SSH }}
          GIT_LFS_SKIP_PUSH: "1"
          GITEE_PUSH_TIMEOUT_S: "600"
          SP_CN_TOKEN: ${{ secrets.SP_CN_TOKEN }}
        run: |
          set -euo pipefail
          WORKDIR="$GITHUB_WORKSPACE/sunnypilot"
          echo "[push-gitee] single attempt (step timeout 10min)"
          set +e
          python3 "$GITHUB_WORKSPACE/tools/sync_to_gitee.py" \
            --action push-gitee \
            --workdir "$WORKDIR" \
            --origin "$GITEE_REPO_SSH" \
            --upstream "https://github.com/sunnypilot/sunnypilot.git"
          ec=$?
          set -e
          if [ "$ec" -ne 0 ]; then
            echo "[push-gitee] failed or timed out (exit_code=${ec})"
            exit "$ec"
          fi

      - name: Finalize sync outputs (mail)
        id: sync_outputs
        if: always() && steps.sync_pull.outcome == 'success'
        shell: bash
        env:
          CI_STEP_OUTCOME_CODEUP: ${{ steps.sync_push_codeup.outcome }}
          CI_STEP_OUTCOME_GITEE: ${{ steps.sync_push_gitee.outcome }}
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/tools/sync_to_gitee.py" \
            --action emit-outputs \
            --workdir "$GITHUB_WORKSPACE/sunnypilot"

      - name: Notify mail — push results
        if: >-
          steps.sync_pull.outcome == 'success' &&
          steps.sync_outputs.outputs.notify_send == 'true'
        continue-on-error: true
        uses: dawidd6/action-send-mail@v17
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: 465
          secure: true
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASS }}
          subject: ${{ steps.sync_outputs.outputs.notify_subject }}
          to: ${{ secrets.MAIL_TO }}
          from: ${{ secrets.MAIL_FROM }}
          body: ${{ steps.sync_outputs.outputs.notify_body }}

      - name: Notify mail — pull FAILED
        if: steps.sync_pull.outcome != 'success'
        continue-on-error: true
        uses: dawidd6/action-send-mail@v17
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: 465
          secure: true
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASS }}
          subject: >-
            [FAIL] ${{ github.repository }} sync-to-gitee pull (run ${{ github.run_id }})
          to: ${{ secrets.MAIL_TO }}
          from: ${{ secrets.MAIL_FROM }}
          body: |
            sunnypilot_cn 同步失败：pull 阶段未成功（补丁/拉取），未执行推送。

            pull: ${{ steps.sync_pull.outcome }}

            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Cleanup old workflow runs (keep latest 20)
        if: always()
        continue-on-error: true
        uses: actions/github-script@v8
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const workflow_id = "sync-to-gitee.yml";
            const keep = 20;

            // List runs (newest first)
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner,
              repo,
              workflow_id,
              per_page: 100,
              exclude_pull_requests: true,
            });

            // Filter out the current run and any in-progress/queued runs
            const filtered = runs.filter(r =>
              r.id !== context.runId &&
              r.status !== "in_progress" &&
              r.status !== "queued"
            );

            if (filtered.length <= keep) {
              core.info(`No cleanup needed. Runs=${filtered.length}, keep=${keep}`);
              return;
            }

            const toDelete = filtered.slice(keep);
            core.info(`Deleting ${toDelete.length} old workflow runs (keeping latest ${keep})`);

            for (const r of toDelete) {
              try {
                await github.rest.actions.deleteWorkflowRun({ owner, repo, run_id: r.id });
                core.info(`Deleted run_id=${r.id} created_at=${r.created_at} status=${r.status}`);
              } catch (e) {
                core.warning(`Failed to delete run_id=${r.id}: ${e.message}`);
              }
            }
