name: sync-deps-mirrors

run-name: >-
  ${{
    github.event_name == 'schedule' && format('sync-deps-mirrors (scheduled) @ {0}', github.ref_name)
    || github.event_name == 'workflow_dispatch' && format('sync-deps-mirrors (manual) @ {0}', github.ref_name)
    || format('sync-deps-mirrors ({0}) @ {1}', github.event_name, github.ref_name)
  }}

on:
  schedule:
    # 每 5 天跑一次（按“每月第 1/6/11/16/21/26/31 日”触发；接近“每 5 天一次”的需求）
    - cron: "17 2 */5 * *"
  workflow_dispatch:
    inputs:
      owner:
        description: "Gitee owner/org (default: xc2026)"
        required: false
        type: string
      only:
        description: "Comma-separated repo labels to sync (optional)"
        required: false
        type: string
      skip:
        description: "Comma-separated repo labels to skip (optional)"
        required: false
        type: string
      sync_mapd_release:
        description: "Also sync mapd release to Gitee (requires GITEE_TOKEN secret; off by default — GitHub→Gitee upload often flaky)"
        required: false
        type: boolean
        default: false
      mapd_tag:
        description: "MAPD_TAG (latest or a specific tag)"
        required: false
        type: string

concurrency:
  group: sync-deps-mirrors
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # GitHub 将逐步收回 Node 20；强制 JS actions 走 Node 24（与 sync-to-gitee.yml 一致）
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Setup SSH agent (Gitee deploy key)
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.GITEE_SSH_PRIVATE_KEY }}

      # 与 sync-to-gitee.yml 共用同一 known_hosts 缓存（key/path 一致）
      - name: Restore Gitee known_hosts cache
        id: gitee_known_hosts_cache
        uses: actions/cache/restore@v5
        with:
          path: .ci-cache/gitee-known_hosts
          key: gitee-known-hosts-v1
          restore-keys: |
            gitee-known-hosts-

      - name: Add gitee.com to known_hosts
        id: gitee_known_hosts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh .ci-cache
          chmod 700 ~/.ssh
          CACHE_FILE=".ci-cache/gitee-known_hosts"
          REFRESHED=false

          install_known_hosts() {
            cp "$CACHE_FILE" ~/.ssh/known_hosts
            chmod 600 ~/.ssh/known_hosts
          }

          keyscan_to_cache() {
            local scan_tmp attempt port
            scan_tmp="$(mktemp)"
            for attempt in 1 2 3 4 5; do
              : > "$scan_tmp"
              for port in 22 443; do
                if ssh-keyscan -T 15 -p "$port" -t rsa,ecdsa,ed25519 gitee.com >"$scan_tmp" 2>/dev/null \
                  && grep -q '^gitee.com ' "$scan_tmp"; then
                  grep '^gitee.com ' "$scan_tmp" | sort -u > "$CACHE_FILE"
                  install_known_hosts
                  echo "[known_hosts] ssh-keyscan ok (attempt ${attempt}, port ${port})"
                  rm -f "$scan_tmp"
                  return 0
                fi
              done
              echo "[known_hosts] ssh-keyscan attempt ${attempt}/5 failed, retry in $((attempt * 5))s..."
              sleep $((attempt * 5))
            done
            rm -f "$scan_tmp"
            return 1
          }

          host_key_usable() {
            local out
            out="$(ssh -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes \
              -o NumberOfPasswordPrompts=0 -T git@gitee.com 2>&1)" || true
            if echo "$out" | grep -qiE 'Host key verification failed|REMOTE HOST IDENTIFICATION HAS CHANGED'; then
              return 1
            fi
            return 0
          }

          if [ -f "$CACHE_FILE" ] && grep -q '^gitee.com ' "$CACHE_FILE"; then
            install_known_hosts
            echo "[known_hosts] loaded from Actions cache (restore hit=${{ steps.gitee_known_hosts_cache.outputs.cache-hit }})"
            if host_key_usable; then
              echo "[known_hosts] cache keys accepted by SSH"
            else
              echo "[known_hosts] cache keys rejected, refreshing via ssh-keyscan..."
              keyscan_to_cache || { echo "::error::known_hosts: cache invalid and ssh-keyscan failed"; exit 1; }
              REFRESHED=true
            fi
          else
            echo "[known_hosts] cache miss or empty, scanning gitee.com..."
            keyscan_to_cache || { echo "::error::known_hosts: ssh-keyscan failed"; exit 1; }
            REFRESHED=true
          fi

          grep -q '^gitee.com ' ~/.ssh/known_hosts
          echo "refreshed=${REFRESHED}" >> "$GITHUB_OUTPUT"

      - name: Save Gitee known_hosts cache
        if: >-
          steps.gitee_known_hosts.outputs.refreshed == 'true' ||
          steps.gitee_known_hosts_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .ci-cache/gitee-known_hosts
          key: gitee-known-hosts-v1

      # 可选：缓存 mirror 仓库，后续增量 fetch/push 会更快
      - name: Cache mirror repos
        uses: actions/cache@v5
        with:
          path: /tmp/sp_dep_mirrors_cache
          key: dep-mirrors-${{ runner.os }}-v1
          restore-keys: |
            dep-mirrors-${{ runner.os }}-

      - name: Sync dependency mirrors (branches + tags)
        shell: bash
        env:
          DEP_MIRROR_OWNER: ${{ github.event.inputs.owner || 'xc2026' }}
          DEP_MIRROR_ONLY: ${{ github.event.inputs.only || '' }}
          DEP_MIRROR_SKIP: ${{ github.event.inputs.skip || '' }}
          DEP_MIRROR_CACHE_DIR: /tmp/sp_dep_mirrors_cache
          GIT_SSH_COMMAND: "ssh -o ConnectTimeout=25 -o ConnectionAttempts=1 -o BatchMode=yes"
          DEP_MIRROR_PUSH_TRIES: "4"
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          # mapd：默认关闭；仅手动 Run 且勾选「sync_mapd_release」时上传（定时任务不同步 mapd，避免境外 Runner 上传失败）
          SYNC_MAPD_RELEASE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.sync_mapd_release == 'true' && '1' || '' }}
          MAPD_TAG: ${{ github.event.inputs.mapd_tag || 'latest' }}
          # mapd 上传到 Gitee Release 附件：multipart 单次请求超时（秒），由 tools/sync_to_gitee.py 读取；可调大防慢网/写超时
          GITEE_UPLOAD_TIMEOUT_S: "900"
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/tools/sync_dep_mirrors.py"

      - name: Cleanup old workflow runs (keep latest 5)
        if: always()
        continue-on-error: true
        uses: actions/github-script@v8
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const workflow_id = "sync-deps-mirrors.yml";
            const keep = 5;

            // List runs (newest first)
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner,
              repo,
              workflow_id,
              per_page: 100,
              exclude_pull_requests: true,
            });

            // Filter out the current run and any in-progress/queued runs
            const filtered = runs.filter(r =>
              r.id !== context.runId &&
              r.status !== "in_progress" &&
              r.status !== "queued"
            );

            if (filtered.length <= keep) {
              core.info(`No cleanup needed. Runs=${filtered.length}, keep=${keep}`);
              return;
            }

            const toDelete = filtered.slice(keep);
            core.info(`Deleting ${toDelete.length} old workflow runs (keeping latest ${keep})`);

            for (const r of toDelete) {
              try {
                await github.rest.actions.deleteWorkflowRun({ owner, repo, run_id: r.id });
                core.info(`Deleted run_id=${r.id} created_at=${r.created_at} status=${r.status}`);
              } catch (e) {
                core.warning(`Failed to delete run_id=${r.id}: ${e.message}`);
              }
            }
